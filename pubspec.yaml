name: cvnova
description: "CVNova — build and manage resumes, with AI-assisted scoring."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  http: ^1.2.1

  # Theme mode persistence
  shared_preferences: ^2.2.3

  # Typography
  google_fonts: ^6.2.1

  # Micro-animations (splash screen, etc.)
  flutter_animate: ^4.5.0

  # PDF picking for the ATS resume analyzer
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
