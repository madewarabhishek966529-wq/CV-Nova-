name: cvnova
description: "CVNova — AI-powered resume builder & career assistant"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Fonts & typography
  google_fonts: ^6.2.1

  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

  # Storage (for theme preference, auth token cache — later phases)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/lottie/
  #   - assets/images/
