version: "3.9"

# Local dev infra only. The FastAPI app itself runs with `uvicorn` on the
# host during Phase 2 for fast reload; a Dockerfile + full compose stack for
# the app is added in the deployment phase.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvnova
      POSTGRES_PASSWORD: cvnova
      POSTGRES_DB: cvnova
    ports:
      - "5432:5432"
    volumes:
      - cvnova_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvnova"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  cvnova_pg_data:
